<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Kongunga High School</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .auth-page {
            background: linear-gradient(135deg, rgba(26, 58, 79, 0.9), rgba(44, 95, 138, 0.9)), radial-gradient(circle at 20% 50%, rgba(230, 126, 34, 0.2) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header .css-logo {
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <div class="css-logo small" style="margin: 0 auto 15px;">KHS</div>
                    <h2>Reset Password</h2>
                    <p style="color: #666; margin-top: 10px;">Enter your email to receive reset instructions</p>
                </div>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" required>
                    </div>
                    <button type="submit" class="btn-submit" style="width: 100%;">Send Reset Link</button>
                </form>

                <div class="auth-footer">
                    <p>Remember your password? <a href="login.html" style="color: #e67e22; text-decoration: none; font-weight: 600;">Login here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
