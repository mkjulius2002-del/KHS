<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Kongunga High School</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <h2>Set New Password</h2>
                </div>
                    <form method="post">
                        <div class="form-group">
                            <label for="id_new_password1">New Password</label>
                            <input type="password" name="new_password1" id="id_new_password1" placeholder="Enter new password" required>
                            
                                <div class="error"></div>
                            
                        </div>
                        <div class="form-group">
                            <label for="id_new_password2">Confirm New Password</label>
                            <input type="password" name="new_password2" id="id_new_password2" placeholder="Confirm new password" required>
                            
                                <div class="error"></div>
                            
                        </div>
                        <button type="submit" class="btn-submit">Reset Password</button>
                    </form>
                
                    <p style="color: #dc3545; font-size: 16px; text-align: center; margin: 20px 0;">
                        The password reset link is invalid or has expired.
                    </p>
                    <p style="text-align: center;">
                        <a href="password_reset.html" class="btn-primary">Request New Reset Link</a>
                    </p>
                <div class="auth-footer">
                    <p><a href="login.html">← Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
