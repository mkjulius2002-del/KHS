<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Kongunga High School</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="css-logo">KHS</div>
                <h2>Create an Account</h2>
                <p>Register to start your application</p>
            </div>
            
            <!-- Display Django messages -->
            ">
                        
                    </div>
            <form method="post" action="signup.html" id="signupForm">
                
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="full_name" id="signupName" placeholder="Enter your full name" value="" required>
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" id="signupEmail" placeholder="Enter your email" value="" required>
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" name="phone" id="signupPhone" placeholder="Enter your phone number" value="" required>
                </div>
                <div class="form-group">
                    <label>Register as *</label>
                    <select name="user_type" id="userType" required>
                        <option value="">Select</option>
                        <option value="student" selected>Student</option>
                        <option value="parent" selected>Parent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" name="password" id="signupPassword" placeholder="Create a password (min 6 characters)" required>
                    <div class="password-hint">
                        <ul>
                            <li>At least 6 characters long</li>
                            <li>Include uppercase and lowercase letters</li>
                            <li>Include at least one number</li>
                        </ul>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn-submit" id="signupBtn">Sign Up & Apply</button>
            </form>
            <div id="signupMessage" class="form-message"></div>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Login here</a></p>
                <p style="margin-top: 10px; font-size: 13px; color: #888;">
                    By signing up, you agree to our Terms of Service and Privacy Policy.
                </p>
            </div>
        </div>
    </div>
    <script>
        // Signup Form Submission
        const signupForm = document.getElementById('signupForm');
        const signupBtn = document.getElementById('signupBtn');
        
        if (signupForm) {
            signupForm.addEventListener('submit', function(e) {
                // Get form values
                const name = document.getElementById('signupName').value.trim();
                const email = document.getElementById('signupEmail').value.trim();
                const phone = document.getElementById('signupPhone').value.trim();
                const userType = document.getElementById('userType').value;
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Client-side validation
                let errors = [];
                
                if (!name) {
                    errors.push('Please enter your full name');
                }
                
                if (!email) {
                    errors.push('Please enter your email address');
                } else if (!email.includes('@')) {
                    errors.push('Please enter a valid email address');
                }
                
                if (!phone) {
                    errors.push('Please enter your phone number');
                } else if (phone.length < 10) {
                    errors.push('Please enter a valid phone number (minimum 10 digits)');
                }
                
                if (!userType) {
                    errors.push('Please select whether you are a parent or student');
                }
                
                if (!password) {
                    errors.push('Please create a password');
                } else if (password.length < 6) {
                    errors.push('Password must be at least 6 characters long');
                }
                
                if (!confirmPassword) {
                    errors.push('Please confirm your password');
                } else if (password !== confirmPassword) {
                    errors.push('Passwords do not match');
                }
                
                // If there are errors, prevent submission
                if (errors.length > 0) {
                    e.preventDefault();
                    showMessage('signupMessage', errors.join('<br>'), 'error');
                    return false;
                }
                
                // Show loading state
                signupBtn.textContent = 'Creating Account...';
                signupBtn.disabled = true;
                
                // Form will submit to Django backend
                return true;
            });
        }
        function showMessage(elementId, message, type) {
            const msgDiv = document.getElementById(elementId);
            if (msgDiv) {
                msgDiv.innerHTML = message;
                msgDiv.className = `form-message ${type}`;
                setTimeout(() => {
                    msgDiv.innerHTML = '';
                    msgDiv.className = 'form-message';
                }, 8000);
            }
        }
        // Auto-hide Django messages after 8 seconds
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.form-message');
            messages.forEach(function(msg) {
                setTimeout(function() {
                    msg.style.display = 'none';
                }, 8000);
            });
        });
    </script>
</body>
</html>
