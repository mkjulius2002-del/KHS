<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kongunga High School</title>
    <link rel="stylesheet" href="main.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="css-logo">KHS</div>
                <h2>Welcome Back!</h2>
                <p>Login to your account</p>
            </div>
            
            <!-- Display Django messages -->
            ">
                        
                    </div>
            <div class="form-message warning">
                Please login or create an account to continue with your application.
            </div>
            <form method="post" action="login.html?next=" id="loginForm">
                <input type="hidden" name="next" value="">
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" id="loginEmail" placeholder="Enter your email" value="" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="password_reset.html" class="forgot-password">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">Login</button>
            </form>
            <div id="loginMessage" class="form-message"></div>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
            </div>
        </div>
    </div>
    <script>
        // Login Form Submission
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        
        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                
                // Client-side validation
                let errors = [];
                
                if (!email) {
                    errors.push('Please enter your email address');
                } else if (!email.includes('@')) {
                    errors.push('Please enter a valid email address');
                }
                
                if (!password) {
                    errors.push('Please enter your password');
                }
                
                // If there are errors, prevent submission
                if (errors.length > 0) {
                    e.preventDefault();
                    showMessage('loginMessage', errors.join('<br>'), 'error');
                    return false;
                }
                
                // Show loading state
                loginBtn.textContent = 'Logging in...';
                loginBtn.disabled = true;
                
                // Form will submit to Django backend
                return true;
            });
        }
        function showMessage(elementId, message, type) {
            const msgDiv = document.getElementById(elementId);
            if (msgDiv) {
                msgDiv.innerHTML = message;
                msgDiv.className = `form-message ${type}`;
                setTimeout(() => {
                    msgDiv.innerHTML = '';
                    msgDiv.className = 'form-message';
                }, 8000);
            }
        }
        // Auto-hide Django messages after 8 seconds
        document.addEventListener('DOMContentLoaded', function() {
            const messages = document.querySelectorAll('.form-message');
            messages.forEach(function(msg) {
                setTimeout(function() {
                    msg.style.display = 'none';
                }, 8000);
            });
        });
    </script>
</body>
</html>
